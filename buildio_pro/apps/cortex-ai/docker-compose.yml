services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cortex_ai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cortex_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cortex_ai}
      POSTGRES_DB: ${POSTGRES_DB:-cortex_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cortex_ai} -d ${POSTGRES_DB:-cortex_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9
    container_name: cortex_ai_valkey
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cortex_ai_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9003}
    ports:
      # 9000/9001 are used by expense-tracker's MinIO; offset to avoid conflicts
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: cortex_ai_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} && mc mb --ignore-existing local/${S3_BUCKET:-cortex-ai}"

  # Dedicated Postgres for testing the connector feature.
  # The main app's Postgres (above) stays separate and untouched.
  connector-postgres:
    image: pgvector/pgvector:pg17
    container_name: cortex_ai_connector_postgres
    restart: always
    environment:
      POSTGRES_USER: ${CONNECTOR_POSTGRES_USER:-connector_test}
      POSTGRES_PASSWORD: ${CONNECTOR_POSTGRES_PASSWORD:-connector_test}
      POSTGRES_DB: ${CONNECTOR_POSTGRES_DB:-connector_test}
    ports:
      # 5432 is the main app Postgres; 5433 is expense-tracker's
      - "5434:5432"
    volumes:
      - connector_postgres_data:/var/lib/postgresql/data
      # Sample data for testing the connector feature (runs on a fresh volume
      # only; see docker/connector-postgres-init.sql for a manual apply)
      - ./docker/connector-postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONNECTOR_POSTGRES_USER:-connector_test} -d ${CONNECTOR_POSTGRES_DB:-connector_test}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: cortex_ai_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-cortex_ai}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cortex_ai}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-cortex_ai}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.4
    container_name: cortex_ai_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cortex_ai_root}
      MYSQL_USER: ${MYSQL_USER:-cortex_ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cortex_ai}
      MYSQL_DATABASE: ${MYSQL_DB:-cortex_ai}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-cortex_ai_root}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # SQLite is embedded, not a server. This one-shot job seeds a sample.db
  # onto the sqlite_data volume for testing the connector's file-upload flow.
  sqlite-init:
    image: keinos/sqlite3:latest
    container_name: cortex_ai_sqlite_init
    volumes:
      - sqlite_data:/data
    entrypoint: >
      /bin/sh -c "[ -f /data/sample.db ] || sqlite3 /data/sample.db \"CREATE TABLE customers (id INTEGER PRIMARY KEY, name TEXT NOT NULL, email TEXT UNIQUE); CREATE TABLE orders (id INTEGER PRIMARY KEY, customer_id INTEGER REFERENCES customers(id), total_cents INTEGER NOT NULL, created_at TEXT DEFAULT CURRENT_TIMESTAMP); INSERT INTO customers (name, email) VALUES ('Ada Lovelace', 'ada@example.com'), ('Alan Turing', 'alan@example.com'); INSERT INTO orders (customer_id, total_cents) VALUES (1, 4999), (1, 2500), (2, 12000);\""

volumes:
  postgres_data:
  connector_postgres_data:
  valkey_data:
  minio_data:
  mongo_data:
  mysql_data:
  sqlite_data:
