services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: expense_tracker_postgres
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense_tracker}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense_tracker} -d ${POSTGRES_DB:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9
    container_name: expense_tracker_valkey
    restart: "no"
    ports:
      - "6380:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  s3:
    image: chrislusf/seaweedfs:4.54@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    restart: "no"
    command: ["mini", "-dir=/data", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-expense-tracker}
    ports:
      - "9000:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsSI --aws-sigv4 aws:amz:us-east-1:s3
          --user "$${AWS_ACCESS_KEY_ID}:$${AWS_SECRET_ACCESS_KEY}"
          "http://127.0.0.1:8333/$${S3_BUCKET}" >/dev/null
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  valkey_data:
  seaweedfs_data:
